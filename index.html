<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fairway — Disc Golf Tracker</title>
    <meta name="theme-color" content="#F2EDE1" />
    <meta name="apple-mobile-web-app-title" content="Fairway" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved light/dark choice before the page draws (same key as src/lib/theme.js).
      try { if (localStorage.getItem('dg-theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
