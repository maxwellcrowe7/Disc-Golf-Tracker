<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="orange">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE1">
<title>Fairway — season atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="view"></main>
</div>
<header class="topbar" id="topbar"></header>
<nav class="tabbar" id="tabbar"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<div class="proto" id="proto">
  <span>Accent</span>
  <button class="sw" data-accent="orange" aria-label="Disc orange accent"><i style="background:#FF5A1F"></i></button>
  <button class="sw" data-accent="lime" aria-label="Lime accent"><i style="background:#A8CF45"></i></button>
  <b></b>
  <button data-theme-toggle aria-label="Toggle dark mode"></button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="proto.js"></script>
</body>
</html>
